<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>설문조사</title>
</head>
<body>
  <h1>설문조사</h1>
  <form>
    <p>1. 성별</p>
    <input type="radio" name="gender"> 남성
    <input type="radio" name="gender"> 여성
    <hr>
    <p>2. 연령대</p>
    <input type="radio" name="age"> 10대
    <input type="radio" name="age"> 20대
    <input type="radio" name="age"> 30대
    <hr>
    <p>3. 만족도</p>
    <input type="radio" name="satisfaction"> 좋음
    <input type="radio" name="satisfaction"> 보통
    <input type="radio" name="satisfaction"> 나쁨
    <hr>
    <p>4. 의견</p>
    <textarea rows="4" cols="30"></textarea>

    <br><br>
    <button>제출</button>
  </form>

</body>
</html>
