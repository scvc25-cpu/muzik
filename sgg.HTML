<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Admin Page</title>
</head>

<body data-bs-theme="light">

<div class="container mt-5">

  <!-- 헤더 -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>신규 등록 상품</h3>
    <button class="btn btn-outline-secondary btn-sm" id="darkModeBtn">
      🌙 다크모드
    </button>
  </div>

  <!-- 검색 영역 -->
  <form id="searchForm" class="row g-2 align-items-center mb-4">

    <!-- 카테고리 -->
    <div class="col-md-3">
      <select class="form-select" name="category_data_table" id="categorySelect">
        <option value="">전체 카테고리</option>
        <option value="상의">상의</option>
        <option value="하의">하의</option>
        <option value="신발">신발</option>
        <option value="패션잡화">패션잡화</option>
      </select>
    </div>

    <!-- 상품 검색 -->
    <div class="col-md-5">
      <div class="input-group">
        <input type="text" class="form-control" id="searchInput" placeholder="상품명 검색">
        <span class="input-group-text">🔍</span>
      </div>
    </div>

  </form>

  <!-- 테이블 -->
  <table class="table table-bordered table-hover text-center align-middle">
    <thead class="table-dark">
      <tr>
        <th>카테고리</th>
        <th>브랜드</th>
        <th>상품명</th>
        <th>가격</th>
      </tr>
    </thead>
    <tbody id="product_data_Table"></tbody>
  </table>

  <!-- 페이지네이션 -->
  <nav>
    <ul class="pagination justify-content-center" id="pagination"></ul>
  </nav>

</div>

<script>
  const product_data = [
    { category: "상의", brand: 'Supreme', product: '슈프림 박스로고 후드티', price: '390,000' },
    { category: "하의", brand: 'DIESEL', product: '디젤 트랙 팬츠', price: '188,000' },
    { category: "신발", brand: 'Nike', product: '에어포스 1', price: '137,000' },
    { category: "패션잡화", brand: 'Music&Goods', product: '빵빵이 키링', price: '29,000' },
    { category: "신발", brand: 'Adidas', product: '삼바 OG', price: '139,000' },
    { category: "상의", brand: 'Nike', product: '오프화이트 티셔츠', price: '59,000' },
  ];

  const rowsPerPage = 3;
  let currentPage = 1;
  let filteredData = [...product_data];

  const tableBody = document.getElementById('product_data_Table');
  const pagination = document.getElementById('pagination');

  function renderTable(page) {
    tableBody.innerHTML = '';
    const start = (page - 1) * rowsPerPage;
    const end = start + rowsPerPage;

    filteredData.slice(start, end).forEach(item => {
      const row = tableBody.insertRow();
      row.insertCell(0).innerText = item.category;
      row.insertCell(1).innerText = item.brand;
      row.insertCell(2).innerText = item.product;
      row.insertCell(3).innerText = item.price;
    });
  }

  function renderPagination() {
    pagination.innerHTML = '';
    const pageCount = Math.ceil(filteredData.length / rowsPerPage);

    for (let i = 1; i <= pageCount; i++) {
      const li = document.createElement('li');
      li.className = `page-item ${i === currentPage ? 'active' : ''}`;

      const a = document.createElement('a');
      a.className = 'page-link';
      a.innerText = i;
      a.href = '#';
      a.onclick = () => {
        currentPage = i;
        renderTable(currentPage);
        renderPagination();
      };

      li.appendChild(a);
      pagination.appendChild(li);
    }
  }

  function applyFilter() {
    const category = document.getElementById('categorySelect').value;
    const keyword = document.getElementById('searchInput').value.toLowerCase();

    filteredData = product_data.filter(item => {
      return (category === '' || item.category === category) &&
             item.product.toLowerCase().includes(keyword);
    });

    currentPage = 1;
    renderTable(currentPage);
    renderPagination();
  }

  // 검색 이벤트
  document.getElementById('categorySelect').addEventListener('change', applyFilter);
  document.getElementById('searchInput').addEventListener('input', applyFilter);

  // 다크모드
  document.getElementById('darkModeBtn').addEventListener('click', () => {
    const body = document.body;
    body.setAttribute(
      'data-bs-theme',
      body.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark'
    );
  });

  // 초기 로딩
  renderTable(currentPage);
  renderPagination();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
