<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사용자 목록</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <h1>👥 사용자 목록</h1>

    <ul>
        {% for user in users %}
            <li>
                <strong>이름:</strong> {{ user.name }}<br>
                <strong>아이디:</strong> {{ user.username }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
