<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light" data-bs-theme="light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <!-- 다크모드 버튼 -->
      <div class="d-flex justify-content-end mb-2">
        <button class="btn btn-outline-secondary btn-sm" id="darkModeBtn">
          🌙 다크모드
        </button>
      </div>

      <div class="card shadow">
        <div class="card-body p-4">
          <h3 class="text-center mb-4">회원가입</h3>

          <form class="needs-validation" novalidate>

            <!-- 아이디 -->
            <div class="mb-3">
              <label class="form-label">아이디</label>
              <input type="text" class="form-control" required>
              <div class="invalid-feedback">아이디를 입력하세요.</div>
            </div>

            <!-- 이메일 -->
            <div class="mb-3">
              <label class="form-label">이메일</label>
              <input type="email" class="form-control" required>
              <div class="invalid-feedback">올바른 이메일을 입력하세요.</div>
            </div>

            <!-- 비밀번호 -->
            <div class="mb-3">
              <label class="form-label">비밀번호</label>
              <input type="password" class="form-control" id="password" required minlength="6">
              <div class="invalid-feedback">비밀번호는 6자 이상이어야 합니다.</div>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="mb-3">
              <label class="form-label">비밀번호 확인</label>
              <input type="password" class="form-control" id="passwordConfirm" required>
              <div class="invalid-feedback">비밀번호가 일치하지 않습니다.</div>
            </div>

            <!-- 약관 -->
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" required>
              <label class="form-check-label">이용약관에 동의합니다</label>
              <div class="invalid-feedback">약관 동의는 필수입니다.</div>
            </div>

            <!-- 버튼 -->
            <div class="d-grid">
              <button class="btn btn-primary" type="submit">회원가입</button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // 유효성 검사 + 회원가입 완료 처리
  (() => {
    const form = document.querySelector('.needs-validation');

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      const pw = document.getElementById('password');
      const pwConfirm = document.getElementById('passwordConfirm');

      // 비밀번호 일치 검사
      if (pw.value !== pwConfirm.value) {
        pwConfirm.setCustomValidity('불일치');
      } else {
        pwConfirm.setCustomValidity('');
      }

      if (form.checkValidity()) {
        // 회원가입 완료 알림
        alert("🎉 회원가입이 완료되었습니다!");

        // 페이지 전환
        window.location.href = "signup-success.html";
      } else {
        event.stopPropagation();
      }

      form.classList.add('was-validated');
    });
  })();

  // 다크모드 토글
  document.getElementById('darkModeBtn').addEventListener('click', () => {
    const body = document.body;
    body.setAttribute(
      'data-bs-theme',
      body.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark'
    );
  });
</script>

</body>
</html>
